[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shop-cli"
version = "0.1.0"
description = "Agent-native commerce CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "canonicaljson>=2.0",  # RFC 8785 JCS for mandate signing (python-jcs unavailable on PyPI)
    "pyyaml>=6.0",
    "eval_type_backport>=0.2; python_version < '3.10'",  # X | None in Pydantic models on 3.9
]

[project.scripts]
shop = "shop.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "--tb=short"
markers = [
    "integration: real-credential tests — run with ./scripts/run-integration-tests.sh",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.coverage.run]
source = ["src/shop"]
omit = ["tests/*"]
